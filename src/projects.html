<body>
    <div class="portofolio portofolio-2">

        <!-- @include components/navbar.html -->

        <!-- Main Projects Grid Section -->
        <section id="projects-section">
            <div class="container">
                <h1 class="section-title text-center mb-5" data-aos="fade-down" data-translate="projects_page_title">
                    Daftar Proyek & Karya
                </h1>

                <!-- Category Filters -->
                <div class="filter-container" data-aos="fade-up" data-aos-delay="100">
                    <button class="filter-btn active" data-filter="all" data-translate="filter_all">Semua</button>
                    <button class="filter-btn" data-filter="web" data-translate="filter_web">Website</button>
                    <button class="filter-btn" data-filter="aplikasi" data-translate="filter_app">Aplikasi</button>
                </div>

                <!-- Projects Grid -->
                <div class="row gy-4 px-2" id="projects-grid">
                    <!-- Dynamic projects will be injected here via sheet-sync.js -->
                    <div class="w-100 text-center py-5">
                        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Loading Projects...</span>
                        </div>
                    </div>
            </div>
        </section>

        <!-- @include components/footer.html -->

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/bilingual.js"></script>
    <script src="assets/js/sheet-sync.js"></script>
    <script>
        AOS.init();

        // Set active link in navbar dynamically
        const currentPath = window.location.pathname;
        if (currentPath.includes('projects.html')) {
            document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
                link.classList.remove('active');
                const href = link.getAttribute('href');
                if (href === 'projects.html') {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                } else {
                    link.removeAttribute('aria-current');
                }
            });
        }

        // JS Filter Logic
        const filterButtons = document.querySelectorAll('.filter-btn');

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const projectItems = document.querySelectorAll('.project-grid-item');
                // Change active button
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');

                projectItems.forEach(item => {
                    const category = item.getAttribute('data-category');

                    if (filterValue === 'all') {
                        item.classList.remove('d-none');
                    } else if (category === filterValue) {
                        item.classList.remove('d-none');
                    } else {
                        item.classList.add('d-none');
                    }
                });

                // Refresh AOS animations for visible items
                AOS.refresh();
            });
        });
    </script>
